[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-glass-box"
version = "0.1.0"
description = "A local-first control plane for sandboxed coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Magic Glass Box contributors"}]
dependencies = []

[project.optional-dependencies]
development = [
    "coverage[toml]",
    "jsonschema[format]",
    "mutmut==3.6.0",
    "pytest",
    "ruff",
]

[project.scripts]
magic-glass-box = "magic_glass_box.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.coverage.run]
branch = true
source = ["magic_glass_box"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mutmut]
source_paths = ["src/magic_glass_box"]
also_copy = ["Makefile", "scripts/", "schemas/", "examples/"]
# SQLite keywords are case-insensitive, so Mutmut's lower/upper string
# transformations are equivalent mutants. Database behavior is exercised by
# the integration tests, including invalid SQL produced by other mutations.
do_not_mutate_patterns = [
    '^\s*"(?:SELECT|INSERT|UPDATE|DELETE|CREATE|DROP|ALTER|PRAGMA|BEGIN|COMMIT|ROLLBACK)\b',
]
do_not_mutate = [
    "src/magic_glass_box/__init__.py",
    "src/magic_glass_box/__main__.py",
]
mutate_only_covered_lines = true
pytest_add_cli_args_test_selection = ["tests"]
timeout_multiplier = 15.0
timeout_constant = 1.0
