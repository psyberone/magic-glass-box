[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-glass-box"
version = "0.1.0"
description = "A local-first control plane for sandboxed coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Magic Glass Box contributors"}]
dependencies = []

[project.optional-dependencies]
development = [
    "coverage[toml]",
    "jsonschema[format]",
    "mutmut==3.6.0",
    "PyJWT[crypto]>=2.10,<3",
    "pytest",
    "rfc3339-validator>=0.1.4,<0.2",
    "ruff",
]
openai-connector = ["PyJWT[crypto]>=2.10,<3"]

[project.scripts]
magic-glass-box = "magic_glass_box.cli:main"
magic-glass-box-execution-provider = "magic_glass_box.execution_provider_cli:main"
magic-glass-box-github-provider = "magic_glass_box.github_provider_cli:main"
magic-glass-box-jira-provider = "magic_glass_box.jira_provider_cli:main"
magic-glass-box-openai-connector = "magic_glass_box.openai_chatgpt_cli:main"
magic-glass-box-remote-runner = "magic_glass_box.remote_runner:main"
magic-glass-box-worker = "magic_glass_box.worker_transport:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/magic-glass-box/schemas" = ["schemas/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.coverage.run]
branch = true
source = ["magic_glass_box"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mutmut]
source_paths = ["src/magic_glass_box"]
also_copy = ["Makefile", "scripts/", "schemas/", "examples/", "docker/"]
# SQLite keywords are case-insensitive, so Mutmut's lower/upper string
# transformations are equivalent mutants. Database behavior is exercised by
# the integration tests, including invalid SQL produced by other mutations.
# Human-readable validation diagnostics and argparse prose are likewise not
# protocol fields. Tests bind exception types, normalized error codes, and CLI
# behavior without making capitalization or wording a compatibility surface.
do_not_mutate_patterns = [
    '^\s*"(?:SELECT|INSERT|UPDATE|DELETE|CREATE|DROP|ALTER|PRAGMA|BEGIN|COMMIT|ROLLBACK)\b',
    '^\s*raise\s+(?:ExecutionOperationError|ExecutionProviderCLIError|ExecutionProviderError|GatewayContractError|GitHubProviderError|GitHubProviderCLIError|JiraProviderError|JiraProviderCLIError|JiraTransportError|RemoteRunnerError|ValidationError|argparse\.ArgumentTypeError)\b',
    '^\s*(?:field|subject|help|description|prog)\s*=',
]
do_not_mutate = [
    "src/magic_glass_box/__init__.py",
    "src/magic_glass_box/__main__.py",
]
mutate_only_covered_lines = true
pytest_add_cli_args_test_selection = ["tests"]
timeout_multiplier = 15.0
timeout_constant = 1.0
